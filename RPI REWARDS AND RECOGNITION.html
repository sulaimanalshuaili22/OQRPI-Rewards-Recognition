<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>OQ Rewards Nomination Form | Smart Auto-fill</title>
    <!-- Google Fonts & simple reset -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f0f2f8;
            padding: 32px 24px;
            color: #1a2744;
        }

        .form-canvas {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* Header */
        .header {
            background: #1a2744;
            padding: 24px 32px;
        }

        .header h1 {
            color: white;
            font-size: 1.7rem;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .header p {
            color: #e8841a;
            font-size: 0.85rem;
            font-weight: 500;
            margin-top: 6px;
        }

        /* Form content */
        .form-content {
            padding: 28px 32px 36px;
        }

        .section-card {
            background: #ffffff;
            border-radius: 20px;
            border: 1px solid #eef0f4;
            margin-bottom: 28px;
            padding: 20px 24px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            transition: all 0.2s;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1a2744;
            border-left: 4px solid #e8841a;
            padding-left: 14px;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            margin-bottom: 22px;
        }

        .form-group {
            flex: 1;
            min-width: 220px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #5b6e8c;
            margin-bottom: 8px;
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            font-size: 0.9rem;
            border: 1.5px solid #e2e5ec;
            border-radius: 14px;
            font-family: 'Inter', monospace;
            background: #fff;
            transition: 0.2s;
            outline: none;
        }

        .form-group input:focus, 
        .form-group select:focus, 
        .form-group textarea:focus {
            border-color: #e8841a;
            box-shadow: 0 0 0 3px rgba(232,132,26,0.1);
        }

        .form-group input[readonly], 
        .form-group input[disabled] {
            background-color: #f8f9fc;
            border-color: #e9edf2;
            color: #2d3a5e;
            font-weight: 500;
        }

        .search-employee-group {
            background: #fefaf5;
            border-radius: 20px;
            padding: 6px 0 0 0;
        }

        .inline-search {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .inline-search .form-group {
            flex: 3;
        }

        .search-btn {
            background: #1a2744;
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            height: 48px;
        }

        .search-btn:hover {
            background: #e8841a;
        }

        .error-message {
            color: #c52828;
            font-size: 0.7rem;
            margin-top: 6px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .success-toast {
            background: #e0f2e9;
            color: #1e7b48;
            padding: 12px 18px;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 20px;
            display: inline-block;
        }

        .action-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            margin-top: 20px;
            border-top: 1px solid #edf0f5;
            padding-top: 28px;
        }

        .btn-save, .btn-submit {
            padding: 12px 32px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            border: none;
        }

        .btn-save {
            background: #ffffff;
            border: 1.5px solid #1a2744;
            color: #1a2744;
        }

        .btn-save:hover {
            background: #f0f2f8;
        }

        .btn-submit {
            background: #e8841a;
            color: white;
            box-shadow: 0 2px 6px rgba(232,132,26,0.3);
        }

        .btn-submit:hover {
            background: #cf6f0e;
            transform: translateY(-1px);
        }

        hr {
            margin: 16px 0;
            border-color: #edf0f4;
        }

        .badge-category-hint {
            font-size: 0.7rem;
            color: #e8841a;
            margin-top: 6px;
        }

        @media (max-width: 700px) {
            body {
                padding: 16px;
            }
            .form-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div id="root"></div>

<!-- React & ReactDOM -->
<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
    // --------------------------------------------------------------
    // MOCK EMPLOYEE DATABASE (linked by employee ID or name)
    // Contains: id, fullName, function, department, manager, email
    // --------------------------------------------------------------
    const employeesDB = [
        { id: "10045", fullName: "Amira Al-Hinai", function: "Global Marketing", department: "Marketing Excellence", manager: "Nadia Al-Rawahi", email: "amira.alhinai@oq.com", joinDate: "2021-03-12" },
        { id: "10087", fullName: "Khalid Al-Rawahi", function: "Assets Management", department: "Asset Strategy", manager: "Tariq Al-Balushi", email: "khalid.alrawahi@oq.com", joinDate: "2019-11-01" },
        { id: "10123", fullName: "Fatima Al-Balushi", function: "HSSE RPI", department: "HSSE & Quality", manager: "Rashid Al-Saadi", email: "fatima.balushi@oq.com", joinDate: "2022-06-20" },
        { id: "10234", fullName: "Ahmed Al-Mahrooqi", function: "Polymers Operations", department: "Operations", manager: "Salem Al-Harthi", email: "ahmed.mahrooqi@oq.com", joinDate: "2020-09-15" },
        { id: "10356", fullName: "Maryam Al-Kindi", function: "People & Culture", department: "HR Business Partners", manager: "Huda Al-Siyabi", email: "maryam.kindi@oq.com", joinDate: "2018-04-22" },
        { id: "10478", fullName: "Salem Al-Harthi", function: "OQ Logistics", department: "Supply Chain", manager: "Youssef Al-Hasani", email: "salem.harthi@oq.com", joinDate: "2017-12-05" },
        { id: "10599", fullName: "Noor Al-Saidi", function: "Business Planning", department: "Corporate Planning", manager: "Khalid Al-Mamari", email: "noor.saidi@oq.com", joinDate: "2023-01-18" },
        { id: "10633", fullName: "Hassan Al-Siyabi", function: "Technical Services", department: "Engineering", manager: "Layla Al-Hasani", email: "hassan.siyabi@oq.com", joinDate: "2020-08-30" },
        { id: "10777", fullName: "Layla Al-Hasani", function: "Global Sales", department: "Commercial", manager: "Omar Al-Kindi", email: "layla.hasani@oq.com", joinDate: "2019-05-14" },
        { id: "10888", fullName: "Youssef Al-Mamari", function: "RPI Operations", department: "Refinery Ops", manager: "Iman Al-Rawahi", email: "youssef.mamari@oq.com", joinDate: "2021-11-02" },
        { id: "10999", fullName: "Muna Al-Hosni", function: "Financial Control", department: "Finance", manager: "Hassan Al-Balushi", email: "muna.hosni@oq.com", joinDate: "2022-09-11" },
        { id: "11012", fullName: "Rashid Al-Riyami", function: "Procurement", department: "Strategic Sourcing", manager: "Ahmed Al-Kaabi", email: "rashid.riyami@oq.com", joinDate: "2023-03-01" }
    ];

    // Award categories list (same as original)
    const awardCategoriesList = [
        "Impact on HSSE", "Impact on OQ Behaviors", "Quick Wins", "Innovation Initiatives",
        "Promoting OQ Learning Culture", "Developing Others", "Lean Initiatives", "Integration Initiatives",
        "Managing Unique Circumstances", "Impact on Sustainability", "Reliability Improvement",
        "Integration & Harmonization", "Process Safety", "Others"
    ];

    const rewardTypesList = ["Above and Beyond Award", "Spot Award", "Team Award"];

    // Helper to find employee by ID or by fullName (case-insensitive, partial)
    const findEmployee = (searchQuery) => {
        if (!searchQuery || searchQuery.trim() === "") return null;
        const query = searchQuery.trim().toLowerCase();
        // first try exact ID match
        let emp = employeesDB.find(e => e.id.toLowerCase() === query);
        if (emp) return emp;
        // then try full name match (case-insensitive)
        emp = employeesDB.find(e => e.fullName.toLowerCase() === query);
        if (emp) return emp;
        // partial name match (contains)
        emp = employeesDB.find(e => e.fullName.toLowerCase().includes(query));
        return emp || null;
    };

    // Main Form Component
    const NominationForm = () => {
        // State for employee lookup
        const [searchInput, setSearchInput] = React.useState("");
        const [selectedEmployee, setSelectedEmployee] = React.useState(null);
        const [searchError, setSearchError] = React.useState("");
        
        // Form fields (auto-filled from employee)
        const [employeeId, setEmployeeId] = React.useState("");
        const [fullName, setFullName] = React.useState("");
        const [functionDept, setFunctionDept] = React.useState("");   // "Function" (business unit)
        const [department, setDepartment] = React.useState("");
        const [managerName, setManagerName] = React.useState("");
        const [email, setEmail] = React.useState("");
        
        // Award & nomination details
        const [rewardType, setRewardType] = React.useState("Above and Beyond Award");
        const [awardCategory, setAwardCategory] = React.useState([]); // multi select array
        const [justification, setJustification] = React.useState("");
        
        // Submission date auto = today (readonly)
        const submissionDate = new Date().toISOString().slice(0,10);
        
        // UI status
        const [saveMessage, setSaveMessage] = React.useState("");
        const [submitMessage, setSubmitMessage] = React.useState("");
        
        // Reset form fields based on selected employee
        const populateFromEmployee = (emp) => {
            if (emp) {
                setEmployeeId(emp.id);
                setFullName(emp.fullName);
                setFunctionDept(emp.function);
                setDepartment(emp.department);
                setManagerName(emp.manager);
                setEmail(emp.email);
                setSearchError("");
            } else {
                setEmployeeId("");
                setFullName("");
                setFunctionDept("");
                setDepartment("");
                setManagerName("");
                setEmail("");
            }
        };
        
        const handleSearchEmployee = () => {
            if (!searchInput.trim()) {
                setSearchError("Please enter Employee ID or Full Name");
                return;
            }
            const emp = findEmployee(searchInput);
            if (emp) {
                setSelectedEmployee(emp);
                populateFromEmployee(emp);
                setSearchError("");
            } else {
                setSelectedEmployee(null);
                populateFromEmployee(null);
                setSearchError(`No employee found matching "${searchInput}"`);
            }
        };
        
        const handleCategoryToggle = (cat) => {
            if (awardCategory.includes(cat)) {
                setAwardCategory(awardCategory.filter(c => c !== cat));
            } else {
                setAwardCategory([...awardCategory, cat]);
            }
        };
        
        const validateForm = () => {
            if (!selectedEmployee) {
                setSearchError("Please search and select a valid employee before submitting.");
                return false;
            }
            if (awardCategory.length === 0) {
                alert("⚠ Please select at least one Award Category.");
                return false;
            }
            if (!justification.trim() || justification.trim().length < 10) {
                alert("⚠ Please provide a detailed justification (minimum 10 characters).");
                return false;
            }
            return true;
        };
        
        const handleSave = () => {
            if (!selectedEmployee) {
                setSaveMessage("❗ Cannot save: No employee selected.");
                setTimeout(() => setSaveMessage(""), 2000);
                return;
            }
            // Save to localStorage simulation
            const draft = {
                employeeId, fullName, functionDept, department, managerName, email,
                rewardType, awardCategory, justification, submissionDate, savedAt: new Date().toISOString()
            };
            localStorage.setItem("oq_nomination_draft", JSON.stringify(draft));
            setSaveMessage("✅ Draft saved locally!");
            setTimeout(() => setSaveMessage(""), 2500);
        };
        
        const handleSubmit = () => {
            if (!validateForm()) return;
            // Build final payload (matching original rewards.json structure)
            const nominationRecord = {
                id: "NOM-" + new Date().toISOString().slice(0,19).replace(/[-:T]/g, ''),
                employeeId: employeeId,
                employeeName: fullName,
                function: functionDept,
                department: department,
                rewardType: rewardType,
                awardCategory: awardCategory.join("; "),
                justification: justification,
                nominationDate: submissionDate,
                managerName: managerName,
                status: "Pending",
                email: email,
                submittedBy: "Current User (OQ)"
            };
            console.log("✅ Nomination Submitted:", nominationRecord);
            // Show success message and optionally reset selected employee but keep categories?
            setSubmitMessage(`🎉 Nomination for ${fullName} (${rewardType}) submitted successfully!`);
            // Optional: clear sensitive? but keep form for next nomination (reset search)
            setTimeout(() => {
                setSubmitMessage("");
                // reset employee after 3 seconds? but keep optional, we'll not force reset to prevent frustration.
            }, 4000);
            // In real scenario: patch to OQ_Rewards table. Here we show alert + console
            alert(`🏆 Nomination submitted!\n\nEmployee: ${fullName}\nReward: ${rewardType}\nCategories: ${awardCategory.join(", ")}\nJustification: ${justification.substring(0,100)}...`);
        };
        
        const clearForm = () => {
            setSearchInput("");
            setSelectedEmployee(null);
            setEmployeeId("");
            setFullName("");
            setFunctionDept("");
            setDepartment("");
            setManagerName("");
            setEmail("");
            setAwardCategory([]);
            setJustification("");
            setRewardType("Above and Beyond Award");
            setSearchError("");
            setSaveMessage("");
            setSubmitMessage("");
        };
        
        return (
            <div className="form-canvas">
                <div className="header">
                    <h1>📋 OQ Rewards Nomination</h1>
                    <p>Above and Beyond Award — Smart nomination form (auto-fill by Employee ID / Name)</p>
                </div>
                
                <div className="form-content">
                    {(saveMessage || submitMessage) && (
                        <div className="success-toast" style={{marginBottom: '16px'}}>
                            {saveMessage || submitMessage}
                        </div>
                    )}
                    
                    {/* SEARCH SECTION */}
                    <div className="section-card search-employee-group">
                        <div className="section-title">
                            <span>🔍</span> Step 1: Identify Employee
                        </div>
                        <div className="inline-search">
                            <div className="form-group" style={{flex: 1}}>
                                <label>Employee ID or Full Name *</label>
                                <input 
                                    type="text"
                                    placeholder="e.g. 10045 or Amira Al-Hinai"
                                    value={searchInput}
                                    onChange={(e) => setSearchInput(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && handleSearchEmployee()}
                                />
                                {searchError && <div className="error-message">⚠ {searchError}</div>}
                            </div>
                            <button className="search-btn" onClick={handleSearchEmployee}>🔎 Search & Load</button>
                            <button className="search-btn" style={{background: '#6c7a8e'}} onClick={clearForm}>Clear</button>
                        </div>
                        <div className="badge-category-hint" style={{marginTop: '12px'}}>
                            💡 After search, employee details, function, department, manager will be auto-filled.
                        </div>
                    </div>
                    
                    {/* EMPLOYEE INFORMATION (auto-filled) */}
                    <div className="section-card">
                        <div className="section-title">
                            <span>👤</span> Employee Details (Auto-filled)
                        </div>
                        <div className="form-row">
                            <div className="form-group">
                                <label>Employee ID</label>
                                <input type="text" value={employeeId} readOnly disabled />
                            </div>
                            <div className="form-group">
                                <label>Full Name</label>
                                <input type="text" value={fullName} readOnly disabled />
                            </div>
                        </div>
                        <div className="form-row">
                            <div className="form-group">
                                <label>Function / Business Unit</label>
                                <input type="text" value={functionDept} readOnly disabled />
                            </div>
                            <div className="form-group">
                                <label>Department</label>
                                <input type="text" value={department} readOnly disabled />
                            </div>
                        </div>
                        <div className="form-row">
                            <div className="form-group">
                                <label>Direct Manager</label>
                                <input type="text" value={managerName} readOnly disabled />
                            </div>
                            <div className="form-group">
                                <label>Company Email</label>
                                <input type="text" value={email} readOnly disabled />
                            </div>
                        </div>
                    </div>
                    
                    {/* AWARD DETAILS */}
                    <div className="section-card">
                        <div className="section-title">
                            <span>🏆</span> Award Details
                        </div>
                        <div className="form-row">
                            <div className="form-group">
                                <label>Reward Type *</label>
                                <select value={rewardType} onChange={(e) => setRewardType(e.target.value)}>
                                    {rewardTypesList.map(rt => <option key={rt} value={rt}>{rt}</option>)}
                                </select>
                            </div>
                            <div className="form-group">
                                <label>Nomination Date</label>
                                <input type="text" value={submissionDate} readOnly disabled />
                                <div className="badge-category-hint">Automatically set to today</div>
                            </div>
                        </div>
                        
                        <div className="form-group" style={{marginBottom: '12px'}}>
                            <label>Award Category * (select all that apply)</label>
                            <div style={{display: 'flex', flexWrap: 'wrap', gap: '12px', marginTop: '12px'}}>
                                {awardCategoriesList.map(cat => (
                                    <label key={cat} style={{display: 'flex', alignItems: 'center', gap: '8px', background: '#f9fafc', padding: '6px 14px', borderRadius: '40px', border: awardCategory.includes(cat) ? '1.5px solid #e8841a' : '1px solid #e2e5ec', cursor: 'pointer'}}>
                                        <input 
                                            type="checkbox" 
                                            checked={awardCategory.includes(cat)}
                                            onChange={() => handleCategoryToggle(cat)}
                                            style={{width: '18px', height: '18px', accentColor: '#e8841a'}}
                                        />
                                        <span style={{fontSize: '0.8rem', fontWeight: 500}}>{cat}</span>
                                    </label>
                                ))}
                            </div>
                            {awardCategory.length === 0 && <div className="error-message" style={{marginTop: '12px'}}>⚠ Select at least one category</div>}
                        </div>
                    </div>
                    
                    {/* JUSTIFICATION */}
                    <div className="section-card">
                        <div className="section-title">
                            <span>✍️</span> Justification & Impact
                        </div>
                        <div className="form-group">
                            <label>Detailed Justification * (specific examples & outcomes)</label>
                            <textarea 
                                rows="5" 
                                placeholder="Describe the employee's contribution, impact on OQ values, safety, innovation, or business results..."
                                value={justification}
                                onChange={(e) => setJustification(e.target.value)}
                                style={{resize: 'vertical'}}
                            ></textarea>
                            <div className="badge-category-hint">{justification.length} characters (minimum 10 recommended)</div>
                        </div>
                    </div>
                    
                    {/* ATTACHMENTS PLACEHOLDER - optional */}
                    <div className="section-card">
                        <div className="section-title">
                            <span>📎</span> Attachments (Optional)
                        </div>
                        <div className="form-group">
                            <label>Supporting Documents</label>
                            <input type="file" multiple accept=".pdf,.jpg,.png,.docx" />
                            <div className="badge-category-hint">Upload evidence (max 5MB per file) - optional</div>
                        </div>
                    </div>
                    
                    {/* ACTION BUTTONS */}
                    <div className="action-buttons">
                        <button className="btn-save" onClick={handleSave}>💾 Save Draft</button>
                        <button className="btn-submit" onClick={handleSubmit}>📨 Submit Nomination</button>
                    </div>
                    <div style={{fontSize: '0.7rem', textAlign: 'right', marginTop: '12px', color: '#7b8a9e'}}>
                        * All fields marked with auto-fill are linked to Employee ID. Award categories & justification required for submission.
                    </div>
                </div>
            </div>
        );
    };
    
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<NominationForm />);
</script>
</body>
</html>
